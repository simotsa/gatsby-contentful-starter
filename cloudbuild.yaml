steps:
  - name: node:22.23.3
    entrypoint: yarn
    args: ["install"]
  - name: node:22.23.3
    entrypoint: yarn
    args: ["add", "-W", "firebase-tools@^11.30.0"]
  - name: node:22.23.3
    entrypoint: yarn
    args: ["build"]
    env:
      - 'CONTENTFUL_SPACE_ID=$_SPACE_ID'
      - 'CONTENTFUL_ACCESS_TOKEN=$_ACCESS_TOKEN'
  - name: "node:22.23.3"
    entrypoint: "./node_modules/.bin/firebase"
    args: ["deploy", "--project", "mcac-contentful", "--token", "$_TOKEN"]
